<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tutora – Razorpay test checkout</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
    button { margin-top: 16px; padding: 10px 18px; font: inherit; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; white-space: pre-wrap; }
    .warn { background: #fff4d6; padding: 8px 12px; border-left: 4px solid #e0a800; }
  </style>
</head>
<body>
  <h1>Razorpay test checkout</h1>
  <p class="warn">TEST MODE ONLY. Runs with <code>UPI_PROVIDER=razorpay</code> and <code>rzp_test_</code> keys.
    Use Razorpay's test UPI flows; never real money. UPI Collect is hidden: desktop shows a QR, mobile uses Intent.</p>

  <label>Student access token (from <code>POST /student/auth/login</code>)
    <input id="token" placeholder="eyJ..." /></label>
  <label>Participant id (from <code>POST /student/bids/:id/accept</code>)
    <input id="participant" placeholder="uuid" /></label>
  <button id="pay">Pay with UPI</button>
  <h3>Log</h3>
  <pre id="log"></pre>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const log = (...a) => { document.getElementById('log').textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x, null, 2)).join(' ') + '\n'; };
    const api = (path, opts = {}) => fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + document.getElementById('token').value.trim(), ...(opts.headers || {}) },
    }).then(async r => ({ status: r.status, body: await r.json().catch(() => null) }));

    document.getElementById('pay').onclick = async () => {
      const participant = document.getElementById('participant').value.trim();
      const started = await api(`/student/participants/${participant}/payments`, {
        method: 'POST', headers: { 'Idempotency-Key': 'web-' + participant },
      });
      log('Order:', started);
      if (started.status !== 201) return;
      const c = started.body.checkout;
      if (c.provider !== 'razorpay') return log('Server is not using Razorpay (UPI_PROVIDER).');
      const rzp = new Razorpay({
        key: c.keyId,
        order_id: c.orderId,
        amount: c.amount,
        currency: c.currency,
        name: 'Tutora (test)',
        description: 'Test session payment',
        ...c.checkoutOptions,
        handler: async (resp) => {
          log('Checkout success callback:', resp);
          const confirmed = await api(`/student/payments/${started.body.id}/confirm`, { method: 'POST', body: JSON.stringify(resp) });
          log('Server confirmation (final state also comes from the webhook):', confirmed);
        },
      });
      rzp.on('payment.failed', (e) => log('Payment failed:', e.error));
      rzp.open();
    };
  </script>
</body>
</html>
